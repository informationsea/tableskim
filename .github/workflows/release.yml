name: Release

# Pushing a tag such as v0.1.0 builds packages on every platform and attaches
# them to a GitHub release.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

# The jobs read the caches CI saves on main (ccache and the FetchContent
# sources) but save none: a cache saved on a tag's run can be read by that
# tag alone, so it would only take room from CI's.

jobs:
  check-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches project version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(sed -nE 's/^project\(table-skim VERSION ([0-9.]+).*/\1/p' CMakeLists.txt)
          if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match CMakeLists.txt version ${version}" >&2
            exit 1
          fi

  # Built on the oldest supported distribution so the packages also run on
  # newer ones (Ubuntu 24.04 and Rocky Linux 10 both ship glibc 2.39). The
  # packages hold the GUI build only; the terminal UI alone comes as a ZIP
  # (linux-zip).
  linux-deb:
    needs: check-version
    runs-on: ubuntu-24.04
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 1G
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build ccache dpkg-dev \
            libfontconfig1-dev libx11-dev libxext-dev libxft-dev libxinerama-dev \
            libxcursor-dev libxrender-dev libxfixes-dev libpango1.0-dev libcairo2-dev \
            libwayland-dev wayland-protocols libxkbcommon-dev libdbus-1-dev \
            libgtk-3-dev libdecor-0-dev libgl1-mesa-dev libglu1-mesa-dev
      # The ccache CI saved on main (see ci.yml).
      - name: Restore ccache
        uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: ccache-ubuntu-24.04-${{ github.sha }}-${{ github.run_id }}
          restore-keys: ccache-ubuntu-24.04-
      # The statistics are kept in the cache, so they are reset for this
      # run's hit rate (as in ci.yml).
      - name: Reset ccache statistics
        run: ccache --zero-stats
      - name: Build, test and package
        run: |
          cmake --preset release -DTABLESKIM_ENABLE_LTO=ON
          ./package.sh deb
      - name: Show ccache statistics
        run: ccache --show-stats
      - uses: actions/upload-artifact@v4
        with:
          name: linux-deb
          path: build/release/*.deb

  linux-rpm:
    needs: check-version
    runs-on: ubuntu-latest
    container: rockylinux/rockylinux:10
    # CCACHE_DIR is set below: in a container job, ${{ github.workspace }} is
    # the path on the host, not the one mounted in the container.
    env:
      CCACHE_MAXSIZE: 1G
    steps:
      - name: Point ccache at the workspace
        run: echo "CCACHE_DIR=$GITHUB_WORKSPACE/.ccache" >> "$GITHUB_ENV"
      - name: Install dependencies
        run: |
          dnf install -y dnf-plugins-core epel-release
          dnf config-manager --set-enabled crb
          dnf install -y git gcc gcc-c++ make cmake ninja-build ccache rpm-build \
            which findutils tar zstd perl-core python3 \
            fontconfig-devel libX11-devel libXext-devel libXft-devel libXinerama-devel \
            libXcursor-devel libXrender-devel libXfixes-devel pango-devel cairo-devel \
            wayland-devel wayland-protocols-devel libxkbcommon-devel dbus-devel \
            gtk3-devel libdecor-devel mesa-libGL-devel mesa-libGLU-devel
      - uses: actions/checkout@v4
      # The ccache CI saved on main (see ci.yml).
      - name: Restore ccache
        uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: ccache-rocky10-${{ github.sha }}-${{ github.run_id }}
          restore-keys: ccache-rocky10-
      # The statistics are kept in the cache, so they are reset for this
      # run's hit rate (as in ci.yml).
      - name: Reset ccache statistics
        run: ccache --zero-stats
      - name: Build, test and package
        run: |
          cmake --preset release -DTABLESKIM_ENABLE_LTO=ON
          ./package.sh rpm
      - name: Show ccache statistics
        run: ccache --show-stats
      - uses: actions/upload-artifact@v4
        with:
          name: linux-rpm
          path: build/release/*.rpm

  # The Linux ZIPs, built on the oldest distribution the actions run on in
  # a container, glibc 2.28 (RHEL 8, Debian 10, Ubuntu 20.04 and newer), so
  # that one ZIP runs on all of them. GCC comes from gcc-toolset, which
  # links the newer parts of libstdc++ statically. The GUI is built twice:
  # with Wayland (and X11), and for X11 only (-x11 in the ZIP's name), which
  # needs neither libwayland, libxkbcommon, libdecor nor D-Bus at run time.
  linux-zip:
    name: linux-zip (${{ matrix.name }})
    needs: check-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: GUI
            gui: "ON"
            x11_only: "OFF"
            cache: rocky8-wayland
          - name: GUI X11 only
            gui: "ON"
            x11_only: "ON"
            cache: rocky8-x11
          # The terminal UI only, packaged as tableskim-tui.
          - name: TUI only
            gui: "OFF"
            x11_only: "OFF"
            cache: rocky8-tui
    runs-on: ubuntu-latest
    container: rockylinux/rockylinux:8
    # CCACHE_DIR is set below: in a container job, ${{ github.workspace }} is
    # the path on the host, not the one mounted in the container.
    env:
      CCACHE_MAXSIZE: 1G
    steps:
      - name: Point ccache at the workspace
        run: echo "CCACHE_DIR=$GITHUB_WORKSPACE/.ccache" >> "$GITHUB_ENV"
      - name: Install dependencies
        run: |
          dnf install -y dnf-plugins-core epel-release
          dnf config-manager --set-enabled powertools
          dnf install -y git gcc-toolset-14 make cmake ninja-build ccache \
            which findutils tar zstd perl-core python3 \
            fontconfig-devel libX11-devel libXext-devel libXft-devel libXinerama-devel \
            libXcursor-devel libXrender-devel libXfixes-devel pango-devel cairo-devel \
            ${{ matrix.x11_only == 'OFF' && 'wayland-devel wayland-protocols-devel libxkbcommon-devel dbus-devel gtk3-devel mesa-libGL-devel mesa-libGLU-devel' || '' }}
      - uses: actions/checkout@v4
      # The ccache CI saved on main for its Rocky Linux 8 build with Wayland
      # (see ci.yml). The builds differ in FLTK alone, so each starts from it.
      - name: Restore ccache
        uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: ccache-${{ matrix.cache }}-${{ github.sha }}-${{ github.run_id }}
          restore-keys: ccache-rocky8-
      # The statistics are kept in the cache, so they are reset for this
      # run's hit rate (as in ci.yml).
      - name: Reset ccache statistics
        run: ccache --zero-stats
      - name: Build, test and package
        shell: bash
        run: |
          source /opt/rh/gcc-toolset-14/enable
          cmake --preset release -DTABLESKIM_ENABLE_LTO=ON -DTABLESKIM_BUILD_GUI=${{ matrix.gui }} -DTABLESKIM_X11_ONLY=${{ matrix.x11_only }}
          ./package.sh zip
      - name: Show ccache statistics
        run: ccache --show-stats
      - uses: actions/upload-artifact@v4
        with:
          name: linux-zip-${{ matrix.cache }}-gui-${{ matrix.gui }}
          path: build/release/*.zip

  # Apple silicon, and Intel Macs cross-compiled on the same runner, whose
  # tests run under Rosetta 2. Both are configured in build/release (the
  # release preset rather than macos-x86_64-release), where the dependency
  # sources CI saved are restored. Only arm64 finds its objects in the
  # ccache, which CI fills for the native build alone.
  macos:
    name: macos (${{ matrix.arch }})
    needs: check-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            cmake_args: ""
          - arch: x86_64
            cmake_args: -DCMAKE_OSX_ARCHITECTURES=x86_64
    runs-on: macos-latest
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 1G
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: brew install ninja ccache
      # As in ci.yml, so that its cache is found after a runner image update.
      - name: Check the compiler by its version in ccache
        run: echo "CCACHE_COMPILERCHECK=string:$(c++ --version | head -n 1)" >> "$GITHUB_ENV"
      # The ccache CI saved on main (see ci.yml).
      - name: Restore ccache
        uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: ccache-macos-latest-${{ github.sha }}-${{ github.run_id }}
          restore-keys: ccache-macos-latest-
      # The statistics are kept in the cache, so they are reset for this
      # run's hit rate (as in ci.yml).
      - name: Reset ccache statistics
        run: ccache --zero-stats
      - name: Install Rosetta 2
        if: matrix.arch == 'x86_64'
        run: softwareupdate --install-rosetta --agree-to-license
      - name: Build, test and package
        run: |
          cmake --preset release -DTABLESKIM_ENABLE_LTO=ON ${{ matrix.cmake_args }}
          ./package.sh all
      - name: Show ccache statistics
        run: ccache --show-stats
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: |
            build/release/*.dmg
            build/release/*.zip

  # x64 on windows-latest, and ARM64 natively on a Windows on Arm runner
  # (cross-compiling would leave FLTK's fluid and the tests unable to run).
  # CI saves the ccache and the dependency sources for x64 only, so the
  # ARM64 build starts from nothing. The Microsoft Store package is x64
  # only (packaging/windows/make-msix.ps1).
  windows:
    name: windows (${{ matrix.arch }})
    needs: check-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-latest
            preset: msvc-release
            msvc_arch: x64
          - arch: arm64
            runner: windows-11-arm
            preset: msvc-arm64-release
            msvc_arch: arm64
    runs-on: ${{ matrix.runner }}
    env:
      TABLESKIM_PRESET: ${{ matrix.preset }}
      CCACHE_DIR: ${{ github.workspace }}\.ccache
      CCACHE_MAXSIZE: 1.5G
    steps:
      - uses: actions/checkout@v4
      - name: Install NSIS, Ninja and ccache
        run: choco install nsis ninja ccache -y --no-progress
      - name: Set up the MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.msvc_arch }}
      # As in ci.yml, so that its cache is found after a runner image update.
      - name: Check the compiler by its version in ccache
        shell: bash
        run: echo "CCACHE_COMPILERCHECK=string:msvc-$VCToolsVersion" >> "$GITHUB_ENV"
      - name: Add NSIS to PATH
        shell: pwsh
        run: Add-Content $env:GITHUB_PATH "C:\Program Files (x86)\NSIS"
      # The ccache CI saved on main (see ci.yml).
      - name: Restore ccache
        uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: ccache-${{ matrix.runner }}-${{ github.sha }}-${{ github.run_id }}
          restore-keys: ccache-${{ matrix.runner }}-
      # The FetchContent sources CI saved on Windows (see ci.yml), read
      # only: the key must match CI's exactly.
      - name: Find the CMake version
        if: matrix.arch == 'x64'
        id: cmake
        shell: bash
        run: echo "version=$(cmake --version | sed -n '1s/.* //p')" >> "$GITHUB_OUTPUT"
      - name: Restore dependency sources
        if: matrix.arch == 'x64'
        uses: actions/cache/restore@v4
        with:
          path: |
            build/msvc-release/_deps/*-src
            build/msvc-release/_deps/*-subbuild
          key: deps-windows-latest-cmake${{ steps.cmake.outputs.version }}-${{ hashFiles('cmake/Dependencies.cmake', 'cmake/patches/**') }}
      # The statistics are kept in the cache, so they are reset for this
      # run's hit rate (as in ci.yml).
      - name: Reset ccache statistics
        run: ccache --zero-stats
      - name: Build and package
        shell: cmd
        run: |
          cmake --preset %TABLESKIM_PRESET% -DTABLESKIM_ENABLE_LTO=ON || exit /b 1
          package.bat all
      - name: Show ccache statistics
        run: ccache --show-stats
      - name: Run tests
        shell: cmd
        run: ctest --preset ${{ matrix.preset }}
      # The Microsoft Store package, once the repository variables hold the
      # identity Partner Center gives (Product management > Product
      # identity). It is unsigned, as the Store signs it on submission, so it
      # is kept as an artifact of the run for uploading to Partner Center,
      # not attached to the release.
      - name: Package for the Microsoft Store
        if: vars.MSIX_IDENTITY_NAME != '' && matrix.arch == 'x64'
        shell: cmd
        env:
          MSIX_IDENTITY_NAME: ${{ vars.MSIX_IDENTITY_NAME }}
          MSIX_PUBLISHER: ${{ vars.MSIX_PUBLISHER }}
          MSIX_PUBLISHER_DISPLAY_NAME: ${{ vars.MSIX_PUBLISHER_DISPLAY_NAME }}
        run: package.bat msix
      - name: Upload the Microsoft Store package
        if: vars.MSIX_IDENTITY_NAME != '' && matrix.arch == 'x64'
        uses: actions/upload-artifact@v4
        with:
          name: microsoft-store
          path: build/msvc-release/*.msix
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.arch }}
          # Only the packages (tableskim-<version>-Windows-<arch>), not the
          # programs built next to them.
          path: |
            build/${{ matrix.preset }}/*-Windows-*.exe
            build/${{ matrix.preset }}/*-Windows-*.zip
          if-no-files-found: error

  # The web app (src/wasm/README.md), built and tested as in CI's wasm job,
  # as a ZIP to put on any web server (tableskim-<version>-web.zip).
  web:
    needs: check-version
    runs-on: ubuntu-24.04
    env:
      EMSDK_VERSION: 6.0.13
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 1G
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build ccache
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            vscode/package-lock.json
      # emsdk is installed at a fixed path: ccache hashes the paths of the
      # system headers (the sysroot is inside emsdk), and setup-emsdk put
      # them in a new temporary directory each time, so nothing compiled in
      # an earlier run was found. The installed emsdk is cached by its
      # version, which spares its download.
      - name: Restore emsdk
        id: emsdk
        uses: actions/cache/restore@v4
        with:
          path: ~/emsdk
          key: emsdk-${{ runner.os }}-${{ env.EMSDK_VERSION }}
      - name: Install emsdk
        run: |
          if [ "${{ steps.emsdk.outputs.cache-hit }}" != true ]; then
            git clone --depth 1 https://github.com/emscripten-core/emsdk.git "$HOME/emsdk"
            "$HOME/emsdk/emsdk" install "$EMSDK_VERSION"
          fi
          "$HOME/emsdk/emsdk" activate "$EMSDK_VERSION"
          echo "EMSDK=$HOME/emsdk" >> "$GITHUB_ENV"
          echo "$HOME/emsdk" >> "$GITHUB_PATH"
          echo "$HOME/emsdk/upstream/emscripten" >> "$GITHUB_PATH"
      # ccache checks the compiler (em++, a script) by its file time by
      # default, which a fresh install changes. The cache key holds the
      # version.
      - name: Check the compiler by its version in ccache
        run: echo "CCACHE_COMPILERCHECK=string:emsdk-$EMSDK_VERSION" >> "$GITHUB_ENV"
      # The ccache CI saved on main (see ci.yml).
      - name: Restore ccache
        uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: ccache-wasm-${{ env.EMSDK_VERSION }}-${{ github.sha }}-${{ github.run_id }}
          restore-keys: ccache-wasm-${{ env.EMSDK_VERSION }}-
      # The statistics are kept in the cache, so they are reset for this
      # run's hit rate (as in ci.yml).
      - name: Reset ccache statistics
        run: ccache --zero-stats
      - name: Install the web app's packages and Chromium
        # Before configuring, so that CMake finds Playwright.
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Build, test and pack
        run: |
          export EMSDK="${EMSDK:-$(dirname "$(dirname "$(dirname "$(command -v emcc)")")")}"
          cmake --preset wasm-release -DTABLESKIM_ENABLE_LTO=ON -DTABLESKIM_WEB_APP=ON -DTABLESKIM_WEB_TESTS=ON
          cmake --build --preset wasm-release
          ctest --preset wasm-release -j 2
          cmake --build --preset wasm-release --target tableskim-web-zip
      # The VS Code extension, as CI builds and tests it (ci.yml), packed
      # as tableskim-<version>-vscode.vsix.
      - name: Build, test and pack the VS Code extension
        run: |
          cmake --build --preset wasm-release --target tableskim-wasm-node
          cd vscode
          npm ci --no-audit --no-fund
          npm run build
          npm test
          (cd .. && LANG=C.UTF-8 node --test web/tests/vscode.test.cjs)
          npm run package
      - name: Show ccache statistics
        run: ccache --show-stats
      # One artifact each: one of files in two directories would keep
      # their paths, and the release attaches the files at its top.
      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: build/wasm-release/tableskim-*-web.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: vscode
          path: vscode/tableskim-*-vscode.vsix
          if-no-files-found: error

  release:
    needs: [linux-deb, linux-rpm, linux-zip, macos, windows, web]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      # The Store package is unsigned and installs from Partner Center only.
      - name: Leave out the Microsoft Store package
        run: rm -f dist/*.msix
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

  # The VS Code extension goes to the Visual Studio Marketplace and Open VSX
  # (VSCodium and other editors) once the release is made, each only when
  # its token is set as a secret (VSCE_PAT: an Azure DevOps token with
  # Marketplace "Manage" for the publisher informationsea; OVSX_PAT: an
  # Open VSX token of the namespace informationsea). The package is the
  # one the release attaches. Its changelog must name the version: a
  # release with "## Unreleased" fails here, after the GitHub release.
  publish-vscode:
    needs: release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: vscode/package-lock.json
      - uses: actions/download-artifact@v4
        with:
          name: vscode
          path: dist
      - name: Changelog names the version
        run: |
          version="${GITHUB_REF_NAME#v}"
          if ! grep -q "^## ${version}\b" vscode/CHANGELOG.md; then
            echo "vscode/CHANGELOG.md has no '## ${version}': rename '## Unreleased' before tagging" >&2
            exit 1
          fi
      - name: Install vsce
        working-directory: vscode
        run: npm ci --no-audit --no-fund
      - name: Publish to the Visual Studio Marketplace
        if: env.VSCE_PAT != ''
        working-directory: vscode
        run: npx vsce publish --packagePath ../dist/tableskim-*-vscode.vsix
      - name: Publish to Open VSX
        if: env.OVSX_PAT != ''
        run: npx --yes ovsx@1.3.0 publish dist/tableskim-*-vscode.vsix --pat "$OVSX_PAT"

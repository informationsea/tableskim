name: Release

# Pushing a tag such as v0.1.0 builds packages on every platform and attaches
# them to a GitHub release.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches project version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(sed -nE 's/^project\(table-skim VERSION ([0-9.]+).*/\1/p' CMakeLists.txt)
          if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match CMakeLists.txt version ${version}" >&2
            exit 1
          fi

  # Built on the oldest supported distribution so the packages also run on
  # newer ones (Ubuntu 24.04 and Rocky Linux 10 both ship glibc 2.39).
  linux-deb:
    name: linux-deb (GUI ${{ matrix.gui }})
    needs: check-version
    strategy:
      fail-fast: false
      matrix:
        # OFF: the terminal UI only, packaged as tableskim-tui.
        gui: ["ON", "OFF"]
    runs-on: ubuntu-24.04
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 500M
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build ccache dpkg-dev \
            libfontconfig1-dev libx11-dev libxext-dev libxft-dev libxinerama-dev \
            libxcursor-dev libxrender-dev libxfixes-dev libpango1.0-dev libcairo2-dev \
            libwayland-dev wayland-protocols libxkbcommon-dev libdbus-1-dev \
            libgtk-3-dev libdecor-0-dev libgl1-mesa-dev libglu1-mesa-dev
      # The build without the GUI only reads the cache; the one with the GUI
      # (also built by CI, which shares ccache-ubuntu-24.04-*) writes it.
      - name: Restore ccache
        uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: ccache-ubuntu-24.04-${{ github.sha }}-${{ github.run_id }}
          restore-keys: ccache-ubuntu-24.04-
      - name: Build, test and package
        # build.sh does not configure again when the cache exists.
        run: |
          cmake --preset release -DTABLESKIM_BUILD_GUI=${{ matrix.gui }}
          ./package.sh deb
          (cd build/release && cpack -G ZIP)
      - uses: actions/upload-artifact@v4
        with:
          name: linux-deb-gui-${{ matrix.gui }}
          path: |
            build/release/*.deb
            build/release/*.zip
      - name: Save ccache
        if: success() && matrix.gui == 'ON'
        uses: actions/cache/save@v4
        with:
          path: .ccache
          key: ccache-ubuntu-24.04-${{ github.sha }}-${{ github.run_id }}

  linux-rpm:
    name: linux-rpm (GUI ${{ matrix.gui }})
    needs: check-version
    strategy:
      fail-fast: false
      matrix:
        # OFF: the terminal UI only, packaged as tableskim-tui.
        gui: ["ON", "OFF"]
    runs-on: ubuntu-latest
    container: rockylinux/rockylinux:10
    # CCACHE_DIR is set below: in a container job, ${{ github.workspace }} is
    # the path on the host, not the one mounted in the container.
    env:
      CCACHE_MAXSIZE: 500M
    steps:
      - name: Point ccache at the workspace
        run: echo "CCACHE_DIR=$GITHUB_WORKSPACE/.ccache" >> "$GITHUB_ENV"
      - name: Install dependencies
        run: |
          dnf install -y dnf-plugins-core epel-release
          dnf config-manager --set-enabled crb
          dnf install -y git gcc gcc-c++ make cmake ninja-build ccache rpm-build \
            which findutils tar zstd perl-core python3 \
            fontconfig-devel libX11-devel libXext-devel libXft-devel libXinerama-devel \
            libXcursor-devel libXrender-devel libXfixes-devel pango-devel cairo-devel \
            wayland-devel wayland-protocols-devel libxkbcommon-devel dbus-devel \
            gtk3-devel libdecor-devel mesa-libGL-devel mesa-libGLU-devel
      - uses: actions/checkout@v4
      # The build without the GUI only reads the cache; the one with the GUI
      # writes it.
      - name: Restore ccache
        uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: ccache-rocky10-${{ github.sha }}-${{ github.run_id }}
          restore-keys: ccache-rocky10-
      - name: Build, test and package
        run: |
          cmake --preset release -DTABLESKIM_BUILD_GUI=${{ matrix.gui }}
          ./package.sh rpm
          (cd build/release && cpack -G ZIP)
      - uses: actions/upload-artifact@v4
        with:
          name: linux-rpm-gui-${{ matrix.gui }}
          path: |
            build/release/*.rpm
            build/release/*.zip
      - name: Save ccache
        if: success() && matrix.gui == 'ON'
        uses: actions/cache/save@v4
        with:
          path: .ccache
          key: ccache-rocky10-${{ github.sha }}-${{ github.run_id }}

  # A ZIP for older distributions: glibc 2.28 (RHEL 8, Debian 10,
  # Ubuntu 20.04 and newer), the oldest that the actions run on in a
  # container. GCC comes from gcc-toolset, which links the newer parts of
  # libstdc++ statically, and the GUI is X11 only.
  linux-legacy:
    name: linux-legacy (GUI ${{ matrix.gui }})
    needs: check-version
    strategy:
      fail-fast: false
      matrix:
        gui: ["ON", "OFF"]
    runs-on: ubuntu-latest
    container: rockylinux/rockylinux:8
    # CCACHE_DIR is set below: in a container job, ${{ github.workspace }} is
    # the path on the host, not the one mounted in the container.
    env:
      CCACHE_MAXSIZE: 500M
    steps:
      - name: Point ccache at the workspace
        run: echo "CCACHE_DIR=$GITHUB_WORKSPACE/.ccache" >> "$GITHUB_ENV"
      - name: Install dependencies
        run: |
          dnf install -y dnf-plugins-core epel-release
          dnf config-manager --set-enabled powertools
          dnf install -y git gcc-toolset-14 make cmake ninja-build ccache \
            which findutils tar zstd perl-core python3 \
            fontconfig-devel libX11-devel libXext-devel libXft-devel libXinerama-devel \
            libXcursor-devel libXrender-devel libXfixes-devel pango-devel cairo-devel
      - uses: actions/checkout@v4
      # Only this workflow builds here, so the build with the GUI writes the
      # cache and the one without reads it.
      - name: Restore ccache
        uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: ccache-rocky8-${{ github.sha }}-${{ github.run_id }}
          restore-keys: ccache-rocky8-
      - name: Build, test and package
        shell: bash
        run: |
          source /opt/rh/gcc-toolset-14/enable
          cmake --preset release -DTABLESKIM_BUILD_GUI=${{ matrix.gui }} -DTABLESKIM_X11_ONLY=ON
          ./package.sh zip
      - uses: actions/upload-artifact@v4
        with:
          name: linux-legacy-gui-${{ matrix.gui }}
          path: build/release/*.zip
      - name: Save ccache
        if: success() && matrix.gui == 'ON'
        uses: actions/cache/save@v4
        with:
          path: .ccache
          key: ccache-rocky8-${{ github.sha }}-${{ github.run_id }}

  macos:
    needs: check-version
    runs-on: macos-latest
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 500M
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: brew install ninja ccache
      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-macos-latest-${{ github.sha }}-${{ github.run_id }}
          restore-keys: ccache-macos-latest-
      - name: Build, test and package
        run: ./package.sh all
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: |
            build/release/*.dmg
            build/release/*.zip

  windows:
    needs: check-version
    runs-on: windows-latest
    env:
      TABLESKIM_PRESET: msvc-release
      CCACHE_DIR: ${{ github.workspace }}\.ccache
      CCACHE_MAXSIZE: 500M
    steps:
      - uses: actions/checkout@v4
      - name: Install NSIS, Ninja and ccache
        run: choco install nsis ninja ccache -y --no-progress
      - name: Set up the MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
      - name: Add NSIS to PATH
        shell: pwsh
        run: Add-Content $env:GITHUB_PATH "C:\Program Files (x86)\NSIS"
      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-windows-latest-${{ github.sha }}-${{ github.run_id }}
          restore-keys: ccache-windows-latest-
      - name: Build and package
        shell: cmd
        run: package.bat all
      - name: Run tests
        shell: cmd
        run: ctest --preset msvc-release
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          # Only the packages (tableskim-<version>-Windows-<arch>), not the
          # programs built next to them.
          path: |
            build/msvc-release/*-Windows-*.exe
            build/msvc-release/*-Windows-*.zip

  release:
    needs: [linux-deb, linux-rpm, linux-legacy, macos, windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

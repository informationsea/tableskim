name: Release

# Pushing a tag such as v0.1.0 builds packages on every platform and attaches
# them to a GitHub release.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches project version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(sed -nE 's/^project\(table-skim VERSION ([0-9.]+).*/\1/p' CMakeLists.txt)
          if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match CMakeLists.txt version ${version}" >&2
            exit 1
          fi

  # Built on the oldest supported distribution so the packages also run on
  # newer ones (Ubuntu 24.04 and Rocky Linux 10 both ship glibc 2.39).
  linux-deb:
    needs: check-version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build dpkg-dev \
            libfontconfig1-dev libx11-dev libxext-dev libxft-dev libxinerama-dev \
            libxcursor-dev libxrender-dev libxfixes-dev libpango1.0-dev libcairo2-dev \
            libwayland-dev wayland-protocols libxkbcommon-dev libdbus-1-dev \
            libgtk-3-dev libdecor-0-dev libgl1-mesa-dev libglu1-mesa-dev
      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: build/release/_deps
          key: linux-deb-deps-${{ hashFiles('cmake/Dependencies.cmake') }}
      - name: Build, test and package
        run: ./package.sh deb && (cd build/release && cpack -G ZIP)
      - uses: actions/upload-artifact@v4
        with:
          name: linux-deb
          path: |
            build/release/*.deb
            build/release/*.zip

  linux-rpm:
    needs: check-version
    runs-on: ubuntu-latest
    container: rockylinux/rockylinux:10
    steps:
      - name: Install dependencies
        run: |
          dnf install -y dnf-plugins-core epel-release
          dnf config-manager --set-enabled crb
          dnf install -y git gcc gcc-c++ make cmake ninja-build rpm-build \
            which findutils tar zstd perl-core python3 \
            fontconfig-devel libX11-devel libXext-devel libXft-devel libXinerama-devel \
            libXcursor-devel libXrender-devel libXfixes-devel pango-devel cairo-devel \
            wayland-devel wayland-protocols-devel libxkbcommon-devel dbus-devel \
            gtk3-devel libdecor-devel mesa-libGL-devel mesa-libGLU-devel
      - uses: actions/checkout@v4
      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: build/release/_deps
          key: linux-rpm-deps-${{ hashFiles('cmake/Dependencies.cmake') }}
      - name: Build, test and package
        run: ./package.sh rpm
      - uses: actions/upload-artifact@v4
        with:
          name: linux-rpm
          path: build/release/*.rpm

  macos:
    needs: check-version
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: brew install ninja
      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: build/release/_deps
          key: macos-deps-${{ hashFiles('cmake/Dependencies.cmake') }}
      - name: Build, test and package
        run: ./package.sh all
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: |
            build/release/*.dmg
            build/release/*.zip

  windows:
    needs: check-version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install NSIS
        run: choco install nsis -y --no-progress
      - name: Add NSIS to PATH
        shell: pwsh
        run: Add-Content $env:GITHUB_PATH "C:\Program Files (x86)\NSIS"
      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: build/vs-release/_deps
          key: windows-deps-${{ hashFiles('cmake/Dependencies.cmake') }}
      - name: Build and package
        shell: cmd
        run: package.bat all
      - name: Run tests
        shell: cmd
        run: ctest --preset vs-release
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            build/vs-release/*.exe
            build/vs-release/*.zip

  release:
    needs: [linux-deb, linux-rpm, macos, windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

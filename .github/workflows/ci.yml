name: CI

# Builds and tests pushes to main and all pull requests on each platform, and on
# Rocky Linux 10 and 8 (in containers) like the release workflow, and the
# WebAssembly core with the web app. The build without the GUI
# (-DTABLESKIM_BUILD_GUI=OFF) is only built for releases. The Linux ZIPs come
# from Rocky Linux 8 only, as in the release workflow.
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request cancels the run of its previous head; runs on
# main are kept, as each one saves the ccache that later runs start from.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    env:
      PRESET: ${{ matrix.os == 'windows-latest' && 'msvc-release' || 'release' }}
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 1G
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build ccache \
            libfontconfig1-dev libx11-dev libxext-dev libxft-dev libxinerama-dev \
            libxcursor-dev libxrender-dev libxfixes-dev libpango1.0-dev libcairo2-dev \
            libwayland-dev wayland-protocols libxkbcommon-dev libdbus-1-dev \
            libgtk-3-dev libdecor-0-dev libgl1-mesa-dev libglu1-mesa-dev \
            python3-pyte xvfb
      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        run: choco install ninja ccache -y --no-progress
      - name: Set up the MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja ccache
      - name: Restore ccache
        uses: actions/cache/restore@v4
        with:
          path: .ccache
          # The release workflow reads this cache, so the key must match its own.
          key: ccache-${{ matrix.os }}-${{ github.sha }}-${{ github.run_id }}
          restore-keys: ccache-${{ matrix.os }}-
      # The statistics are kept in the cache, so they are reset for this
      # run's hit rate.
      - name: Reset ccache statistics
        run: ccache --zero-stats
      # The sources FetchContent cloned or downloaded, with the stamps of its
      # sub-builds, so that configure does not fetch them again (DuckDB alone
      # takes 30 s). The sub-builds record the CMake that made them, hence
      # its version in the key; only an exact match is restored, so a changed
      # dependency or patch is fetched afresh.
      - name: Find the CMake version
        id: cmake
        shell: bash
        run: echo "version=$(cmake --version | sed -n '1s/.* //p')" >> "$GITHUB_OUTPUT"
      - name: Restore dependency sources
        id: deps
        uses: actions/cache/restore@v4
        with:
          path: |
            build/${{ env.PRESET }}/_deps/*-src
            build/${{ env.PRESET }}/_deps/*-subbuild
          key: deps-${{ matrix.os }}-cmake${{ steps.cmake.outputs.version }}-${{ hashFiles('cmake/Dependencies.cmake', 'cmake/patches/**') }}
      - name: Configure
        # The terminal UI's (tests/tui/) and the GUI's (tests/gui/, under
        # Xvfb) tests run on Linux only.
        run: cmake --preset ${{ env.PRESET }} ${{ runner.os == 'Linux' && '-DTABLESKIM_TUI_TESTS=ON -DTABLESKIM_GUI_TESTS=ON' || '' }}
      - name: Save dependency sources
        if: github.event_name != 'pull_request' && steps.deps.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            build/${{ env.PRESET }}/_deps/*-src
            build/${{ env.PRESET }}/_deps/*-subbuild
          key: ${{ steps.deps.outputs.cache-primary-key }}
      - name: Build
        run: cmake --build --preset ${{ env.PRESET }}
      - name: Show ccache statistics
        run: ccache --show-stats
      # Pull requests only read the ccache: a cache saved on a pull request's
      # ref can be read by that pull request alone, so it would only take
      # room from the caches main and the release workflow read.
      - name: Save ccache
        if: github.event_name != 'pull_request'
        uses: actions/cache/save@v4
        with:
          path: .ccache
          key: ccache-${{ matrix.os }}-${{ github.sha }}-${{ github.run_id }}
      - name: Test
        run: ctest --preset ${{ env.PRESET }}
      - name: Package (ZIP)
        if: runner.os != 'Linux'
        shell: bash
        run: cd build/${{ env.PRESET }} && cpack -G ZIP
      - name: Upload ZIP
        if: runner.os != 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: tableskim-zip-${{ matrix.os }}
          path: build/${{ env.PRESET }}/*.zip
          if-no-files-found: error

  # The distributions the release workflow builds its RPM (Rocky Linux 10)
  # and its Linux ZIPs (Rocky Linux 8: glibc 2.28, gcc-toolset; with Wayland
  # and for X11 only) on. Their ccache is what those release jobs start
  # from. The terminal UI's and the GUI's tests are left to Ubuntu (AUTO:
  # neither pyte nor xvfb-run is installed here).
  rocky:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    container: rockylinux/rockylinux:${{ matrix.version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: rockylinux-10
            version: "10"
            repo: crb
            packages: >-
              gcc gcc-c++ wayland-devel wayland-protocols-devel libxkbcommon-devel
              dbus-devel gtk3-devel libdecor-devel mesa-libGL-devel mesa-libGLU-devel
            x11_only: "OFF"
            cache: rocky10
            restore: rocky10
            save_deps: true
            zip: false
          - name: rockylinux-8
            version: "8"
            repo: powertools
            packages: >-
              gcc-toolset-14 wayland-devel wayland-protocols-devel libxkbcommon-devel
              dbus-devel gtk3-devel mesa-libGL-devel mesa-libGLU-devel
            x11_only: "OFF"
            cache: rocky8-wayland
            restore: rocky8
            save_deps: true
            zip: true
          - name: rockylinux-8-x11
            version: "8"
            repo: powertools
            packages: gcc-toolset-14
            x11_only: "ON"
            cache: rocky8-x11
            restore: rocky8
            # Same sources as rockylinux-8, which saves them.
            save_deps: false
            zip: true
    # The two Rocky Linux 8 builds differ in FLTK alone (same compiler and
    # flags), so each starts from whichever of their caches is newer
    # (restore: the shared key prefix).
    # CCACHE_DIR is set below: in a container job, ${{ github.workspace }} is
    # the path on the host, not the one mounted in the container.
    env:
      CCACHE_MAXSIZE: 1G
    steps:
      - name: Point ccache at the workspace
        run: echo "CCACHE_DIR=$GITHUB_WORKSPACE/.ccache" >> "$GITHUB_ENV"
      - name: Install dependencies
        run: |
          dnf install -y dnf-plugins-core epel-release
          dnf config-manager --set-enabled ${{ matrix.repo }}
          dnf install -y git make cmake ninja-build ccache \
            which findutils tar zstd perl-core python3 \
            fontconfig-devel libX11-devel libXext-devel libXft-devel libXinerama-devel \
            libXcursor-devel libXrender-devel libXfixes-devel pango-devel cairo-devel \
            ${{ matrix.packages }}
      - uses: actions/checkout@v4
      - name: Restore ccache
        uses: actions/cache/restore@v4
        with:
          path: .ccache
          # The release workflow reads this cache, so the key must match its own.
          key: ccache-${{ matrix.cache }}-${{ github.sha }}-${{ github.run_id }}
          restore-keys: ccache-${{ matrix.restore }}-
      # As in the build job above.
      - name: Find the CMake version
        id: cmake
        run: echo "version=$(cmake --version | sed -n '1s/.* //p')" >> "$GITHUB_OUTPUT"
      - name: Restore dependency sources
        id: deps
        uses: actions/cache/restore@v4
        with:
          path: |
            build/release/_deps/*-src
            build/release/_deps/*-subbuild
          key: deps-${{ matrix.restore }}-cmake${{ steps.cmake.outputs.version }}-${{ hashFiles('cmake/Dependencies.cmake', 'cmake/patches/**') }}
      - name: Configure
        shell: bash
        run: |
          if [ -f /opt/rh/gcc-toolset-14/enable ]; then
            source /opt/rh/gcc-toolset-14/enable
          fi
          cmake --preset release -DTABLESKIM_X11_ONLY=${{ matrix.x11_only }}
      - name: Save dependency sources
        if: github.event_name != 'pull_request' && matrix.save_deps && steps.deps.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            build/release/_deps/*-src
            build/release/_deps/*-subbuild
          key: ${{ steps.deps.outputs.cache-primary-key }}
      - name: Build and test
        shell: bash
        run: |
          if [ -f /opt/rh/gcc-toolset-14/enable ]; then
            source /opt/rh/gcc-toolset-14/enable
          fi
          ccache --zero-stats
          cmake --build --preset release
          ccache --show-stats
          ctest --preset release
      - name: Save ccache
        if: github.event_name != 'pull_request'
        uses: actions/cache/save@v4
        with:
          path: .ccache
          key: ccache-${{ matrix.cache }}-${{ github.sha }}-${{ github.run_id }}
      - name: Package (ZIP)
        if: matrix.zip
        run: cd build/release && cpack -G ZIP
      - name: Upload ZIP
        if: matrix.zip
        uses: actions/upload-artifact@v4
        with:
          name: tableskim-zip-${{ matrix.name }}
          path: build/release/*.zip
          if-no-files-found: error

  # The core as WebAssembly (src/wasm/README.md): its tests in Node.js, and
  # the web app (web/) built, linted, format-checked and tested end to end
  # in headless Chromium. Caches as in the build job above.
  wasm:
    name: wasm (web app)
    runs-on: ubuntu-24.04
    env:
      EMSDK_VERSION: 6.0.13
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 1G
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build ccache
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: ${{ env.EMSDK_VERSION }}
          actions-cache-folder: emsdk-cache
      - name: Restore ccache
        uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: ccache-wasm-${{ env.EMSDK_VERSION }}-${{ github.sha }}-${{ github.run_id }}
          restore-keys: ccache-wasm-${{ env.EMSDK_VERSION }}-
      - name: Reset ccache statistics
        run: ccache --zero-stats
      - name: Find the CMake version
        id: cmake
        run: echo "version=$(cmake --version | sed -n '1s/.* //p')" >> "$GITHUB_OUTPUT"
      - name: Restore dependency sources
        id: deps
        uses: actions/cache/restore@v4
        with:
          path: |
            build/wasm-release/_deps/*-src
            build/wasm-release/_deps/*-subbuild
          key: deps-wasm-cmake${{ steps.cmake.outputs.version }}-${{ hashFiles('cmake/Dependencies.cmake', 'cmake/patches/**') }}
      - name: Install the web app's packages and Chromium
        # Before configuring, so that CMake finds Playwright.
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Configure
        # The preset finds the toolchain file through EMSDK
        # (<emsdk>/upstream/emscripten/emcc otherwise tells where it is).
        run: |
          export EMSDK="${EMSDK:-$(dirname "$(dirname "$(dirname "$(command -v emcc)")")")}"
          echo "EMSDK=$EMSDK" >> "$GITHUB_ENV"
          cmake --preset wasm-release -DTABLESKIM_WEB_APP=ON -DTABLESKIM_WEB_TESTS=ON
      - name: Save dependency sources
        if: github.event_name != 'pull_request' && steps.deps.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            build/wasm-release/_deps/*-src
            build/wasm-release/_deps/*-subbuild
          key: ${{ steps.deps.outputs.cache-primary-key }}
      - name: Build
        run: cmake --build --preset wasm-release
      - name: Show ccache statistics
        run: ccache --show-stats
      - name: Save ccache
        if: github.event_name != 'pull_request'
        uses: actions/cache/save@v4
        with:
          path: .ccache
          key: ccache-wasm-${{ env.EMSDK_VERSION }}-${{ github.sha }}-${{ github.run_id }}
      - name: Test
        run: ctest --preset wasm-release
      - name: Upload the web app
        uses: actions/upload-artifact@v4
        with:
          name: tableskim-web
          path: build/wasm-release/web
          if-no-files-found: error

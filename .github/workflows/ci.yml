name: CI

# Builds and tests every push and pull request on each platform, with and
# without the GUI (-DTABLESKIM_BUILD_GUI=OFF).
on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.os }} (GUI ${{ matrix.gui }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-2022]
        gui: ["ON", "OFF"]
    env:
      PRESET: ${{ matrix.os == 'windows-2022' && 'vs-release' || 'release' }}
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies (Linux, GUI)
        if: runner.os == 'Linux' && matrix.gui == 'ON'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build \
            libfontconfig1-dev libx11-dev libxext-dev libxft-dev libxinerama-dev \
            libxcursor-dev libxrender-dev libxfixes-dev libpango1.0-dev libcairo2-dev \
            libwayland-dev wayland-protocols libxkbcommon-dev libdbus-1-dev \
            libgtk-3-dev libdecor-0-dev libgl1-mesa-dev libglu1-mesa-dev
      - name: Install dependencies (Linux, no GUI)
        if: runner.os == 'Linux' && matrix.gui == 'OFF'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build
      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja
      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: build/${{ env.PRESET }}/_deps
          key: ci-${{ matrix.os }}-gui-${{ matrix.gui }}-deps-${{ hashFiles('cmake/Dependencies.cmake') }}
      - name: Configure
        run: cmake --preset ${{ env.PRESET }} -DTABLESKIM_BUILD_GUI=${{ matrix.gui }}
      - name: Build
        run: cmake --build --preset ${{ env.PRESET }}
      - name: Test
        run: ctest --preset ${{ env.PRESET }}

name: CI

# Builds and tests every push and pull request on each platform. The build
# without the GUI (-DTABLESKIM_BUILD_GUI=OFF) is only built for releases.
on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      PRESET: ${{ matrix.os == 'windows-latest' && 'msvc-release' || 'release' }}
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 500M
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build ccache \
            libfontconfig1-dev libx11-dev libxext-dev libxft-dev libxinerama-dev \
            libxcursor-dev libxrender-dev libxfixes-dev libpango1.0-dev libcairo2-dev \
            libwayland-dev wayland-protocols libxkbcommon-dev libdbus-1-dev \
            libgtk-3-dev libdecor-0-dev libgl1-mesa-dev libglu1-mesa-dev
      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        run: choco install ninja ccache -y --no-progress
      - name: Set up the MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja ccache
      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: build/${{ env.PRESET }}/_deps
          key: ci-${{ matrix.os }}-deps-${{ hashFiles('cmake/Dependencies.cmake') }}
      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-ci-${{ matrix.os }}-${{ github.sha }}
          restore-keys: ccache-ci-${{ matrix.os }}-
      - name: Configure
        run: cmake --preset ${{ env.PRESET }}
      - name: Build
        run: cmake --build --preset ${{ env.PRESET }}
      - name: Test
        run: ctest --preset ${{ env.PRESET }}
